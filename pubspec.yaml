name: neon_plume_drop
description: "Neon Plume Drop — a neon cosmic orbit-shift survival arcade."
publish_to: "none"
version: 1.0.2+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  audioplayers: ^6.8.1
  provider: ^6.1.5+1
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  appsflyer_sdk: ^6.17.7
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

